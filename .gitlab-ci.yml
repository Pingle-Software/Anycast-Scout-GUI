stages:
  - test
  - prepare
  - build
  - publish
  - release
  - verify

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:3.41.9"
  ANYCAST_SCOUT_BACKEND_DIR: "$CI_PROJECT_DIR/../backend"
  ANYCAST_SCOUT_BACKEND_REF_FILE: "$CI_PROJECT_DIR/backend.ref"
  ANYCAST_SCOUT_RUST_TOOLCHAIN: "1.95"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/.cargo-target"
  CARGO_ZIGBUILD_IMAGE: "ghcr.io/rust-cross/cargo-zigbuild:0.22.3"
  PACKAGE_NAME: "anycast-scout-gui"

.release_rules: &release_rules
  - if: '$CI_PIPELINE_SOURCE == "pipeline" && $ANYCAST_SCOUT_BACKEND_REF'

.clone_backend_linux: &clone_backend_linux |
  BACKEND_REF="${ANYCAST_SCOUT_BACKEND_REF:-$(tr -d '[:space:]' < "$ANYCAST_SCOUT_BACKEND_REF_FILE")}"
  test -n "$BACKEND_REF"
  BACKEND_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/pingle_software/tools/anycast-scout/backend.git"
  if [ ! -d "$ANYCAST_SCOUT_BACKEND_DIR/.git" ]; then
    rm -rf "$ANYCAST_SCOUT_BACKEND_DIR"
    git clone "$BACKEND_URL" "$ANYCAST_SCOUT_BACKEND_DIR"
  elif ! git -C "$ANYCAST_SCOUT_BACKEND_DIR" remote get-url origin >/dev/null 2>&1; then
    git -C "$ANYCAST_SCOUT_BACKEND_DIR" remote add origin "$BACKEND_URL"
  else
    git -C "$ANYCAST_SCOUT_BACKEND_DIR" remote set-url origin "$BACKEND_URL"
  fi
  git -C "$ANYCAST_SCOUT_BACKEND_DIR" fetch --tags origin
  git -C "$ANYCAST_SCOUT_BACKEND_DIR" checkout --detach "$BACKEND_REF"
  test "$(git -C "$ANYCAST_SCOUT_BACKEND_DIR" rev-parse HEAD)" = "$(git -C "$ANYCAST_SCOUT_BACKEND_DIR" rev-parse "$BACKEND_REF")"

flutter:analyze-and-test:
  stage: test
  image: $FLUTTER_IMAGE
  tags:
    - hetzner
  cache:
    key:
      files:
        - pubspec.lock
      prefix: flutter-3.41
    paths:
      - .pub-cache/
    policy: pull-push
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $ANYCAST_SCOUT_BACKEND_REF'
  before_script:
    - flutter --version
  script:
    - flutter pub get --offline --enforce-lockfile
    - dart format --output=none --set-exit-if-changed .
    - flutter analyze --no-pub
    - flutter test --no-pub
  artifacts:
    when: always
    paths:
      - build/
    expire_in: 14 days

release:prepare:
  stage: prepare
  image: alpine:3.22
  tags:
    - hetzner
  rules: *release_rules
  before_script:
    - apk add --no-cache git
  script:
    - git fetch --tags --quiet || true
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        release_tag="$CI_COMMIT_TAG"
      else
        latest_tag="$(git tag -l | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -n1 || true)"
        if [ -z "$latest_tag" ]; then
          pubspec_version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [ -z "$pubspec_version" ]; then
            echo "failed to find a base GUI version" >&2
            exit 1
          fi
          release_tag="v${pubspec_version}"
        else
          version="${latest_tag#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          release_tag="v${major}.${minor}.$((patch + 1))"
        fi
      fi

      release_version="${release_tag#v}"
      backend_ref="${ANYCAST_SCOUT_BACKEND_REF:-}"
      if [ -z "$backend_ref" ] && [ -f "$ANYCAST_SCOUT_BACKEND_REF_FILE" ]; then
        backend_ref="$(tr -d '[:space:]' < "$ANYCAST_SCOUT_BACKEND_REF_FILE")"
      fi
      {
        echo "GUI_RELEASE_TAG=${release_tag}"
        echo "GUI_RELEASE_VERSION=${release_version}"
        echo "GUI_BACKEND_REF=${backend_ref}"
      } | tee release.env
      echo "Prepared GUI release ${release_tag} (${release_version}) for ${CI_COMMIT_SHA}"
      if [ -n "$backend_ref" ]; then
        echo "Bundling backend ref ${backend_ref}"
      fi
  artifacts:
    reports:
      dotenv: release.env
    paths:
      - release.env
    expire_in: 30 days

build:backend-macos:
  stage: build
  image: $CARGO_ZIGBUILD_IMAGE
  tags:
    - hetzner
  rules: *release_rules
  cache:
    key:
      files:
        - backend.ref
      prefix: cargo-zigbuild-1.95
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - .cargo-target/
    policy: pull-push
  needs:
    - job: release:prepare
      artifacts: true
  before_script:
    - rustup toolchain install "$ANYCAST_SCOUT_RUST_TOOLCHAIN" --profile minimal --no-self-update
    - rustup target add --toolchain "$ANYCAST_SCOUT_RUST_TOOLCHAIN" x86_64-apple-darwin aarch64-apple-darwin
    - rustc "+$ANYCAST_SCOUT_RUST_TOOLCHAIN" --version
    - cargo "+$ANYCAST_SCOUT_RUST_TOOLCHAIN" --version
    - cargo-zigbuild --version
    - *clone_backend_linux
  script:
    - export RELEASE_VERSION="$GUI_RELEASE_VERSION"
    - |
      build_macos_backend_archive() {
        target="$1"
        platform="$2"
        archive_name="anycast-scout-backend-${platform}-${GUI_RELEASE_TAG}.tar.gz"
        (cd "$ANYCAST_SCOUT_BACKEND_DIR" && ANYCAST_SCOUT_VERSION="$RELEASE_VERSION" cargo "+$ANYCAST_SCOUT_RUST_TOOLCHAIN" zigbuild --release --locked --target "$target")
        rm -rf dist/package
        mkdir -p dist/package
        install -m 755 "$CARGO_TARGET_DIR/$target/release/anycast-scout" dist/package/anycast-scout
        tar -C dist/package -czf "dist/${archive_name}" anycast-scout
        (cd dist && sha256sum "${archive_name}" > "${archive_name}.sha256")
        tar -tzf "dist/${archive_name}" | grep -Fx anycast-scout
      }

      mkdir -p dist
      rm -rf "$CARGO_TARGET_DIR/release/build"
      build_macos_backend_archive x86_64-apple-darwin macos-amd64
      build_macos_backend_archive aarch64-apple-darwin macos-arm64
  artifacts:
    when: always
    name: "anycast-scout-backend-macos-${GUI_RELEASE_TAG}"
    paths:
      - dist/
    expire_in: 30 days

build:windows:
  stage: build
  tags:
    - windows
    - lenovo
  rules: *release_rules
  needs:
    - job: release:prepare
      artifacts: true
    - job: flutter:analyze-and-test
      artifacts: false
  script:
    - |
      $backendUrl = "https://gitlab-ci-token:${env:CI_JOB_TOKEN}@gitlab.com/pingle_software/tools/anycast-scout/backend.git"
      if (-not (Test-Path "$env:ANYCAST_SCOUT_BACKEND_DIR\.git")) {
        git clone $backendUrl "$env:ANYCAST_SCOUT_BACKEND_DIR"
      } elseif (-not (git -C $env:ANYCAST_SCOUT_BACKEND_DIR remote get-url origin 2>$null)) {
        git -C $env:ANYCAST_SCOUT_BACKEND_DIR remote add origin $backendUrl
      } else {
        git -C $env:ANYCAST_SCOUT_BACKEND_DIR remote set-url origin $backendUrl
      }
      $backendRef = $env:ANYCAST_SCOUT_BACKEND_REF
      if ([string]::IsNullOrWhiteSpace($backendRef)) {
        $backendRef = (Get-Content $env:ANYCAST_SCOUT_BACKEND_REF_FILE -Raw).Trim()
      }
      if ([string]::IsNullOrWhiteSpace($backendRef)) {
        throw "Backend ref is empty"
      }
      git -C $env:ANYCAST_SCOUT_BACKEND_DIR fetch --tags origin
      git -C $env:ANYCAST_SCOUT_BACKEND_DIR checkout --detach $backendRef
      $resolvedBackendHead = (git -C $env:ANYCAST_SCOUT_BACKEND_DIR rev-parse HEAD).Trim()
      $resolvedBackendRef = (git -C $env:ANYCAST_SCOUT_BACKEND_DIR rev-parse $backendRef).Trim()
      if ($resolvedBackendHead -ne $resolvedBackendRef) {
        throw "Backend checkout mismatch: HEAD=$resolvedBackendHead ref=$resolvedBackendRef"
      }
      $env:RELEASE_VERSION = $env:GUI_RELEASE_VERSION
      flutter --version
      rustup toolchain install $env:ANYCAST_SCOUT_RUST_TOOLCHAIN --profile minimal
      cargo "+$env:ANYCAST_SCOUT_RUST_TOOLCHAIN" --version
      Push-Location $env:ANYCAST_SCOUT_BACKEND_DIR
      cargo "+$env:ANYCAST_SCOUT_RUST_TOOLCHAIN" build --release --locked
      Pop-Location
      $backendVersion = ((Get-Content (Join-Path $env:ANYCAST_SCOUT_BACKEND_DIR "Cargo.toml")) | Select-String -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
      if ([string]::IsNullOrWhiteSpace($backendVersion)) {
        throw "Failed to read backend version"
      }
      $backendExe = Join-Path $env:ANYCAST_SCOUT_BACKEND_DIR "target\release\anycast-scout.exe"
      if (-not (Test-Path $backendExe)) {
        throw "Backend build did not produce $backendExe"
      }
      & $backendExe --version
      flutter pub get --enforce-lockfile
      flutter build windows --release --no-pub --build-name="$env:RELEASE_VERSION" --build-number="$env:CI_PIPELINE_IID" --dart-define="ANYCAST_SCOUT_GUI_VERSION=$env:RELEASE_VERSION+$env:CI_PIPELINE_IID" --dart-define="ANYCAST_SCOUT_CORE_VERSION=$backendVersion"

      $bundleDir = "build/windows/x64/runner/Release"
      $exePath = Join-Path $bundleDir "anycast_scout_gui.exe"
      if (-not (Test-Path $exePath)) {
        throw "Windows release did not produce $exePath"
      }
      $bundleBackendDir = Join-Path $bundleDir "backend"
      New-Item -ItemType Directory -Force $bundleBackendDir | Out-Null
      Copy-Item -Force $backendExe (Join-Path $bundleBackendDir "anycast-scout.exe")
      $bundledBackend = Join-Path $bundleBackendDir "anycast-scout.exe"
      if (-not (Test-Path $bundledBackend)) {
        throw "Windows bundle is missing backend binary at $bundledBackend"
      }
      & $bundledBackend --version

      $process = Start-Process -FilePath (Resolve-Path $exePath) -PassThru
      Start-Sleep -Seconds 8
      if ($process.HasExited -and $process.ExitCode -ne 0) {
        throw "Windows GUI exited early with code $($process.ExitCode)"
      }
      if (-not $process.HasExited) {
        Stop-Process -Id $process.Id -Force
      }

      New-Item -ItemType Directory -Force dist | Out-Null
      $zipPath = "dist/anycast-scout-gui-windows-$env:GUI_RELEASE_TAG.zip"
      if (Test-Path $zipPath) {
        Remove-Item -Force $zipPath
      }
      Compress-Archive -Path "$bundleDir/*" -DestinationPath $zipPath -Force
      $hash = Get-FileHash -Algorithm SHA256 $zipPath
      $checksumLine = "$($hash.Hash.ToLower())  $(Split-Path -Leaf $zipPath)`n"
      $shaPath = Join-Path (Get-Location) "$zipPath.sha256"
      [System.IO.File]::WriteAllText($shaPath, $checksumLine, [System.Text.Encoding]::ASCII)
  artifacts:
    when: always
    name: "anycast-scout-gui-windows-${GUI_RELEASE_TAG}"
    paths:
      - dist/
    expire_in: 30 days

publish:release-assets:
  stage: publish
  image: alpine:3.22
  tags:
    - hetzner
  rules: *release_rules
  needs:
    - job: release:prepare
      artifacts: true
    - job: build:backend-macos
      artifacts: true
    - job: build:windows
      artifacts: true
  before_script:
    - apk add --no-cache curl
  script:
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${GUI_RELEASE_TAG}"
    - |
      for file in dist/*; do
        test -f "$file" || continue
        filename="$(basename "$file")"
        curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" \
          "${PACKAGE_URL}/${filename}"
      done
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 30 days

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - hetzner
  rules: *release_rules
  needs:
    - job: release:prepare
      artifacts: true
    - job: publish:release-assets
      artifacts: false
  script:
    - echo "Creating GitLab release for ${GUI_RELEASE_TAG}"
  release:
    tag_name: "$GUI_RELEASE_TAG"
    ref: "$CI_COMMIT_SHA"
    name: "Anycast Scout GUI ${GUI_RELEASE_TAG}"
    description: "Anycast Scout by Pingle portable desktop release. The Windows GUI bundle includes the native Rust backend binary from ${GUI_BACKEND_REF}, and release artifacts are smoke-launched in CI. macOS backend binaries are cross-compiled with cargo-zigbuild on the Hetzner runner; notarized macOS GUI archives are built by Xcode Cloud from the paired release-macos tag."
    assets:
      links:
        - name: "macOS backend amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${GUI_RELEASE_TAG}/anycast-scout-backend-macos-amd64-${GUI_RELEASE_TAG}.tar.gz"
          filepath: "/anycast-scout-backend-macos-amd64-${GUI_RELEASE_TAG}.tar.gz"
          link_type: "package"
        - name: "macOS backend amd64 SHA256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${GUI_RELEASE_TAG}/anycast-scout-backend-macos-amd64-${GUI_RELEASE_TAG}.tar.gz.sha256"
          filepath: "/anycast-scout-backend-macos-amd64-${GUI_RELEASE_TAG}.tar.gz.sha256"
          link_type: "other"
        - name: "macOS backend arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${GUI_RELEASE_TAG}/anycast-scout-backend-macos-arm64-${GUI_RELEASE_TAG}.tar.gz"
          filepath: "/anycast-scout-backend-macos-arm64-${GUI_RELEASE_TAG}.tar.gz"
          link_type: "package"
        - name: "macOS backend arm64 SHA256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${GUI_RELEASE_TAG}/anycast-scout-backend-macos-arm64-${GUI_RELEASE_TAG}.tar.gz.sha256"
          filepath: "/anycast-scout-backend-macos-arm64-${GUI_RELEASE_TAG}.tar.gz.sha256"
          link_type: "other"
        - name: "Windows app ZIP"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${GUI_RELEASE_TAG}/anycast-scout-gui-windows-${GUI_RELEASE_TAG}.zip"
          filepath: "/anycast-scout-gui-windows-${GUI_RELEASE_TAG}.zip"
          link_type: "package"
        - name: "Windows app ZIP SHA256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${GUI_RELEASE_TAG}/anycast-scout-gui-windows-${GUI_RELEASE_TAG}.zip.sha256"
          filepath: "/anycast-scout-gui-windows-${GUI_RELEASE_TAG}.zip.sha256"
          link_type: "other"

verify:macos-backend-release:
  stage: verify
  image: alpine:3.22
  tags:
    - hetzner
  rules: *release_rules
  needs:
    - job: release:prepare
      artifacts: true
    - job: release:gitlab
      artifacts: false
  before_script:
    - apk add --no-cache curl tar
  script:
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${GUI_RELEASE_TAG}"
    - |
      for platform in macos-amd64 macos-arm64; do
        archive_name="anycast-scout-backend-${platform}-${GUI_RELEASE_TAG}.tar.gz"
        curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --output "$archive_name" "${PACKAGE_URL}/${archive_name}"
        curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --output "${archive_name}.sha256" "${PACKAGE_URL}/${archive_name}.sha256"
        sha256sum -c "${archive_name}.sha256"
        tar -tzf "$archive_name" | grep -Fx anycast-scout
      done

verify:windows-release:
  stage: verify
  tags:
    - windows
    - lenovo
  rules: *release_rules
  needs:
    - job: release:prepare
      artifacts: true
    - job: release:gitlab
      artifacts: false
  script:
    - |
      $packageUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/$env:PACKAGE_NAME/$env:GUI_RELEASE_TAG"
      $zipName = "anycast-scout-gui-windows-$env:GUI_RELEASE_TAG.zip"
      $downloadDir = "release-download"
      New-Item -ItemType Directory -Force $downloadDir | Out-Null
      $headers = @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN }
      Invoke-WebRequest -Headers $headers -Uri "$packageUrl/$zipName" -OutFile "$downloadDir/$zipName"
      Invoke-WebRequest -Headers $headers -Uri "$packageUrl/$zipName.sha256" -OutFile "$downloadDir/$zipName.sha256"

      $expectedHash = (Get-Content "$downloadDir/$zipName.sha256" -Raw).Trim().Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLower()
      $actualHash = (Get-FileHash -Algorithm SHA256 "$downloadDir/$zipName").Hash.ToLower()
      if ($expectedHash -ne $actualHash) {
        throw "SHA256 mismatch for $zipName"
      }

      $extractDir = Join-Path $downloadDir "windows"
      Expand-Archive -Path "$downloadDir/$zipName" -DestinationPath $extractDir -Force
      $exePath = Join-Path $extractDir "anycast_scout_gui.exe"
      if (-not (Test-Path $exePath)) {
        throw "Downloaded Windows release did not contain $exePath"
      }
      $backendPath = Join-Path $extractDir "backend\anycast-scout.exe"
      if (-not (Test-Path $backendPath)) {
        throw "Downloaded Windows release did not contain $backendPath"
      }
      & $backendPath --version
      $process = Start-Process -FilePath (Resolve-Path $exePath) -PassThru
      Start-Sleep -Seconds 8
      if ($process.HasExited -and $process.ExitCode -ne 0) {
        throw "Downloaded Windows GUI exited early with code $($process.ExitCode)"
      }
      if (-not $process.HasExited) {
        Stop-Process -Id $process.Id -Force
      }
